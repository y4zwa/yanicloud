<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <!-- @@ACCENT@@ подставляет бэкенд из cookie yc_accent: иконка должна быть акцентной
         уже в первом ответе, иначе браузер кеширует дефолтную и не обновляет её -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png?s=32&c=@@ACCENT@@">
    <link rel="icon" type="image/png" sizes="180x180" href="/icon.png?s=180&c=@@ACCENT@@">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png?s=512&c=@@ACCENT@@">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg?c=@@ACCENT@@">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaniCloud</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
